<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Preview Card</title>

  <link rel="stylesheet" href="style.css">
  <!-- favicon -->
  <link rel="icon" type="image/x-icon" href="images/favicon-32x32.png">
  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:opsz,wght@14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Card -->
  <div class="card">
    <div class="image">
      <img src="images/illustration-article.svg" alt="illustration-article">
    </div>
    <div class="center">
      <div class="Head">
        <div class="markUp">
          <h3>Learning</h3>
        </div>
        <p>Published 21 Dec 2023</p>
      </div>
      <div class="content">
        <h1>HTML & CSS foundations</h1>
        <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
    </div>
    <div class="imageAvatar">
      <img src="images/image-avatar.webp" alt="avatar-michelle">
      <p>Greg Hooper</p>
    </div>



</body>

</html>
